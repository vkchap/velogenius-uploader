# Builds the single-file Windows uploader and publishes it as the rolling
# "latest" release, so Settings can link to one unchanging URL:
#   https://github.com/vkchap/velogenius-uploader/releases/latest/download/VeloGenius-Uploader.exe
name: Build uploader

on:
  push:
    branches: [main]
    paths: [velogenius_uploader.py, mac/**, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --console --name VeloGenius-Uploader velogenius_uploader.py
      - name: Smoke test
        run: dist\VeloGenius-Uploader.exe --help
      - name: Publish as the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "VeloGenius Uploader" \
            --notes "Current build of the uploader. Windows: download the .exe and double-click it. The first time, Windows shows 'Windows protected your PC': click More info, then Run anyway."
          gh release upload latest dist/VeloGenius-Uploader.exe --clobber

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller

      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYPASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYPASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYPASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, signing every binary as it is collected
        run: |
          pyinstaller --onedir --console --name velogenius-uploader \
            --codesign-identity "Developer ID Application: Van Chappell (386NH3KWBK)" \
            --osx-entitlements-file mac/entitlements.plist \
            velogenius_uploader.py

      - name: Assemble the app bundle
        run: |
          APP="dist/VeloGenius Uploader.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R dist/velogenius-uploader "$APP/Contents/Resources/velogenius-uploader"
          cp mac/launcher.sh "$APP/Contents/MacOS/launcher"
          chmod +x "$APP/Contents/MacOS/launcher"
          sed "s/__VERSION__/${{ github.run_number }}/g" mac/Info.plist > "$APP/Contents/Info.plist"

      - name: Sign the bundle
        run: |
          APP="dist/VeloGenius Uploader.app"
          ID="Developer ID Application: Van Chappell (386NH3KWBK)"
          codesign --force --options runtime --timestamp \
            --entitlements mac/entitlements.plist --sign "$ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize, staple, and wrap in a disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="dist/VeloGenius Uploader.app"
          ID="Developer ID Application: Van Chappell (386NH3KWBK)"
          # Submit, wait, and on anything but Accepted print Apple's own
          # findings: "Invalid" alone says nothing about which file or why.
          notarize() {
            out="$(xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait 2>&1)"
            echo "$out"
            sid="$(echo "$out" | awk '/^  id:/ {print $2; exit}')"
            if ! echo "$out" | grep -q "status: Accepted"; then
              xcrun notarytool log "$sid" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
              exit 1
            fi
          }
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/app.zip"
          notarize "$RUNNER_TEMP/app.zip"
          xcrun stapler staple "$APP"
          hdiutil create -volname "VeloGenius Uploader" -srcfolder "$APP" -ov -format UDZO dist/VeloGenius-Uploader.dmg
          codesign --force --timestamp --sign "$ID" dist/VeloGenius-Uploader.dmg
          notarize dist/VeloGenius-Uploader.dmg
          xcrun stapler staple dist/VeloGenius-Uploader.dmg
          spctl --assess --type open --context context:primary-signature -v dist/VeloGenius-Uploader.dmg

      - name: Publish next to the Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "VeloGenius Uploader" --notes "Current build of the uploader."
          gh release upload latest dist/VeloGenius-Uploader.dmg --clobber
